<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan VIP Store</title>
    <style>
        :root { --p-green: #01875f; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; }
        .header { padding: 18px; border-bottom: 2px solid #eee; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: #333; }
        .app-card { padding: 16px; border-bottom: 1px solid #f1f1f1; display: flex; align-items: center; position: relative; }
        .app-icon { width: 60px; height: 60px; border-radius: 14px; margin-right: 15px; }
        .app-info { flex: 1; }
        .app-name { font-weight: bold; font-size: 16px; }
        .get-btn { background: var(--p-green); color: white; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        /* Silent Progress Bar */
        .p-box { display: none; width: 100%; height: 4px; background: #eee; position: absolute; bottom: 0; left: 0; }
        .p-fill { width: 0%; height: 100%; background: var(--p-green); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="header"><div class="logo">Ranjan Store</div></div>
    <div id="appList"></div>

    <iframe id="silentFrame" style="display:none;"></iframe>

    <script>
        const apps = [
            { id: 1, name: "Free Fire MAX", icon: "https://img.utdstc.com/icon/97a/421/97a421689771694f27577531776957242.png:200", link: "https://d.apkpure.com/b/APK/com.dts.freefiremax?version=latest" },
            { id: 2, name: "Vidmate HD", icon: "https://img.utdstc.com/icon/101/6a3/1016a3c6c0b9d3b841b6c7a6e14a7e94:200", link: "https://vidmate.en.uptodown.com/android/download" },
            { id: 3, name: "WhatsApp Pro", icon: "https://img.utdstc.com/icon/00d/956/00d9564177d853eeb40b953d4c721c5f35d25e83921204d80d2495b2176b6b7a:200", link: "https://d.apkpure.com/b/APK/com.whatsapp?version=latest" }
        ];

        function show() {
            const list = document.getElementById('appList');
            apps.forEach(a => {
                list.innerHTML += `
                    <div class="app-card">
                        <img src="${a.icon}" class="app-icon">
                        <div class="app-info">
                            <div class="app-name">${a.name}</div>
                            <div style="font-size:12px; color:green;">Verified V.I.P</div>
                        </div>
                        <button class="get-btn" id="b-${a.id}" onclick="run('${a.id}', '${a.link}')">GET</button>
                        <div class="p-box" id="pb-${a.id}"><div class="p-fill" id="pf-${a.id}"></div></div>
                    </div>
                `;
            });
        }

        function run(id, url) {
            const btn = document.getElementById('b-' + id);
            const box = document.getElementById('pb-' + id);
            const fill = document.getElementById('pf-' + id);

            btn.style.display = "none";
            box.style.display = "block";

            let w = 0;
            let t = setInterval(() => {
                if (w >= 100) {
                    clearInterval(t);
                    // Silent Trigger: Bina page badle download shuru
                    document.getElementById('silentFrame').src = url;
                    alert("App download shuru ho gaya hai! Notification bar check karein.");
                    btn.style.display = "block";
                    btn.innerText = "OPEN";
                    box.style.display = "none";
                } else {
                    w += 10;
                    fill.style.width = w + "%";
                }
            }, 300);
        }
        window.onload = show;
    </script>
</body>
</html>
