<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Store Login</title>
    <style>
        :root { --google-blue: #1a73e8; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; }
        
        /* Sign-in Screen */
        #login-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
        .g-logo { width: 80px; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: 400; margin-bottom: 8px; }
        .sub { color: #5f6368; margin-bottom: 30px; text-align: center; }
        .input-box { width: 100%; max-width: 350px; padding: 15px; border: 1px solid #dadce0; border-radius: 5px; margin-bottom: 15px; font-size: 16px; outline-color: var(--google-blue); }
        .btn-next { background: var(--google-blue); color: white; border: none; padding: 12px; border-radius: 4px; width: 100%; max-width: 350px; font-size: 16px; font-weight: 500; cursor: pointer; }

        /* OTP Screen Overlay */
        #otp-screen { display: none; position: fixed; inset: 0; background: white; z-index: 6000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--google-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Store Interface (Hidden) */
        #main-store { display: none; }
        .header { padding: 15px; border-bottom: 1px solid #ddd; position: sticky; top: 0; background: white; }
        .profile { width: 35px; height: 35px; background: var(--google-blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; float: right; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="g-logo">
        <div class="title">Sign in</div>
        <div class="sub">Ranjan Store use karne ke liye apna number verify karein</div>
        <input type="tel" id="userPhone" class="input-box" placeholder="Mobile number (+91)">
        <button class="btn-next" onclick="sendOTP()">Next</button>
    </div>

    <div id="otp-screen">
        <div class="loader"></div>
        <div id="otp-status" style="font-size: 18px; color: #202124;">Sending OTP...</div>
        <p style="color: #5f6368; font-size: 14px; margin-top: 10px;">Auto-verifying your device</p>
    </div>

    <div id="main-store">
        <div class="header">
            <div class="profile">R</div>
            <div style="font-size: 20px; font-weight: bold;">Ranjan Store</div>
            <div style="margin-top:15px; background:#f1f3f4; padding:10px; border-radius:25px; color:grey;">🔍 Search apps...</div>
        </div>
        <div style="padding:20px; text-align:center;">
            <h3>Welcome to India's Official Store!</h3>
            <p>Aapka account verify ho gaya hai.</p>
            </div>
    </div>

    <script>
        function sendOTP() {
            let phone = document.getElementById('userPhone').value;
            if(phone.length < 10) {
                alert("Kripya sahi mobile number dalein!");
                return;
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('otp-screen').style.display = 'flex';

            // Fake Bypass Animation
            setTimeout(() => {
                document.getElementById('otp-status').innerText = "OTP Received! ✅";
            }, 2000);

            setTimeout(() => {
                document.getElementById('otp-status').innerText = "Verifying Security...";
            }, 3500);

            setTimeout(() => {
                localStorage.setItem('ranjan_auth', 'true');
                enterStore();
            }, 5000);
        }

        function enterStore() {
            document.getElementById('otp-screen').style.display = 'none';
            document.getElementById('main-store').style.display = 'block';
        }

        window.onload = function() {
            if(localStorage.getItem('ranjan_auth')) {
                enterStore();
            }
        }
    </script>
</body>
</html>
