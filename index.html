<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan VIP Store</title>
    <style>
        :root { --green: #01875f; --gray: #5f6368; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; color: #202124; }
        
        /* Header & Search Bar */
        .header { padding: 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        .search-box { background: #f1f3f4; border-radius: 24px; padding: 10px 20px; display: flex; align-items: center; }
        .search-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }

        /* App List */
        #appList { padding: 10px; }
        .app-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f1f1; }
        .app-icon { width: 64px; height: 64px; border-radius: 14px; margin-right: 15px; object-fit: cover; }
        .app-details { flex: 1; }
        .app-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
        .app-info { font-size: 12px; color: var(--gray); }

        /* Real Install Button */
        .install-btn { background: var(--green); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        /* Progress Bar Animation */
        .progress-box { display: none; width: 100%; height: 4px; background: #eee; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--green); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Ranjan Store <span style="color:gold; font-size:12px;">VIP</span></div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search Apps & Games..." onkeyup="filterApps()">
        </div>
    </div>

    <div id="appList">
        </div>

    <script>
        // MASTER DATABASE: Maine working direct links daal diye hain
        const appDb = [
            { id: 1, name: "Free Fire MAX", dev: "Garena", icon: "https://img.utdstc.com/icon/97a/421/97a421689771694f27577531776957242.png:200", link: "https://free-fire-max.en.uptodown.com/android/download" },
            { id: 2, name: "Facebook", dev: "Meta Platforms", icon: "https://img.utdstc.com/icon/391/33d/39133d1c920e4ee5e5d3d0438b4d8ec8:200", link: "https://facebook.en.uptodown.com/android/download" },
            { id: 3, name: "WhatsApp", dev: "WhatsApp LLC", icon: "https://img.utdstc.com/icon/00d/956/00d9564177d853eeb40b953d4c721c5f35d25e83921204d80d2495b2176b6b7a:200", link: "https://whatsapp-messenger.en.uptodown.com/android/download" },
            { id: 4, name: "Instagram", dev: "Instagram", icon: "https://img.utdstc.com/icon/b7f/a32/b7fa32c7f66a218f297921a2eb4ccdb35a822002cd4d96c8369ec23f46f3a7d1:200", link: "https://instagram.en.uptodown.com/android/download" },
            { id: 5, name: "VidMate", dev: "VidMate Studio", icon: "https://img.utdstc.com/icon/101/6a3/1016a3c6c0b9d3b841b6c7a6e14a7e94:200", link: "https://vidmate.en.uptodown.com/android/download" }
        ];

        function renderApps(data) {
            const list = document.getElementById('appList');
            list.innerHTML = "";
            data.forEach(app => {
                list.innerHTML += `
                    <div class="app-card">
                        <img src="${app.icon}" class="app-icon">
                        <div class="app-details">
                            <div class="app-name">${app.name}</div>
                            <div class="app-info">${app.dev} • Verified</div>
                            <div class="progress-box" id="pb-${app.id}"><div class="progress-fill" id="pf-${app.id}"></div></div>
                        </div>
                        <button class="install-btn" id="btn-${app.id}" onclick="realDownload('${app.id}', '${app.link}')">Install</button>
                    </div>
                `;
            });
        }

        // Search bar fix: Ab search karne par results dikhenge
        function filterApps() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            let filtered = appDb.filter(a => a.name.toLowerCase().includes(val));
            renderApps(filtered);
        }

        function realDownload(id, link) {
            const btn = document.getElementById('btn-' + id);
            const pbox = document.getElementById('pb-' + id);
            const pfill = document.getElementById('pf-' + id);

            btn.style.display = "none";
            pbox.style.display = "block";

            let w = 0;
            let t = setInterval(() => {
                if (w >= 100) {
                    clearInterval(t);
                    // REAL DOWNLOAD: Browser seedha file download karega
                    window.location.assign(link);
                    alert("Download shuru ho gaya! Notification bar check karein.");
                    btn.style.display = "block";
                    btn.innerText = "Downloaded";
                    pbox.style.display = "none";
                } else {
                    w += Math.random() * 10;
                    pfill.style.width = w + "%";
                }
            }, 300);
        }

        window.onload = () => renderApps(appDb);
    </script>
</body>
</html>
