<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan VIP Store</title>
    <style>
        :root { --green: #01875f; --gray: #5f6368; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; color: #202124; }
        .header { padding: 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 20px; font-weight: 900; }
        .search-box { background: #f1f3f4; border-radius: 24px; padding: 10px 20px; display: flex; align-items: center; margin-top: 10px; }
        .search-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }
        #appList { padding: 10px; }
        .app-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f1f1; }
        .app-icon { width: 60px; height: 60px; border-radius: 12px; margin-right: 15px; }
        .app-name { font-weight: 600; font-size: 15px; }
        .install-btn { background: var(--green); color: white; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-left: auto; }
        #loader { text-align: center; padding: 20px; display: none; color: var(--green); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Ranjan Store <span style="color:gold; font-size:12px;">VIP</span></div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search Apps..." onkeyup="if(event.key==='Enter') searchApps()">
        </div>
    </div>

    <div id="loader">Fetching Real Apps...</div>
    <div id="appList"></div>

    <script>
        const apiKey = "ad10381748mshd993eec0dfdf229p181c00jsn865767b4b39b"; // Teri API Key
        const apiHost = "google-play-store-scraper-api.p.rapidapi.com"; // Tera API Host

        async function searchApps() {
            const query = document.getElementById('searchInput').value;
            const list = document.getElementById('appList');
            const loader = document.getElementById('loader');

            if(!query) return;
            list.innerHTML = "";
            loader.style.display = "block";

            const options = {
                method: 'POST',
                headers: {
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ term: query, country: 'in' })
            };

            try {
                const response = await fetch('https://google-play-store-scraper-api.p.rapidapi.com/search-apps', options);
                const data = await response.json();
                loader.style.display = "none";

                data.forEach(app => {
                    list.innerHTML += `
                        <div class="app-card">
                            <img src="${app.icon}" class="app-icon">
                            <div class="app-name">${app.title}</div>
                            <button class="install-btn" onclick="startDownload('${app.title}')">Install</button>
                        </div>`;
                });
            } catch (error) {
                loader.innerText = "API Limit Over! Kal try karein.";
            }
        }

        function startDownload(name) {
            alert(name + " ka download shuru ho raha hai...");
            window.location.assign(`https://d.apkpure.com/b/APK/${name.replace(/\s+/g, '-').toLowerCase()}?version=latest`);
        }
    </script>
</body>
</html>
