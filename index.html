 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan App Store</title>
    <style>
        :root { --g-blue: #1a73e8; --g-grey: #5f6368; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; overflow-x: hidden; }
        
        /* Play Store Style Header */
        .header { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 1000; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .search-container { display: flex; align-items: center; background: #f1f3f4; border-radius: 8px; padding: 10px 15px; }
        .search-container input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; margin-left: 10px; }
        
        /* Full App List */
        .app-list { padding-bottom: 30px; }
        .app-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f3f4; }
        .app-icon { width: 56px; height: 56px; border-radius: 12px; margin-right: 15px; object-fit: cover; background: #eee; }
        .app-info { flex: 1; min-width: 0; }
        .app-name { font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-dev { font-size: 13px; color: var(--g-grey); margin-top: 2px; }

        /* Install Button - Play Store Style */
        .install-btn { background: var(--g-blue); color: white; border: none; padding: 8px 22px; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; }
        
        /* Loading & Error */
        #status { text-align: center; padding: 20px; color: var(--g-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-nav">
            <div style="font-size: 20px; font-weight: bold; color: var(--g-grey);">Ranjan Store</div>
            <div style="width: 32px; height: 32px; background: #FF5722; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">R</div>
        </div>
        <div class="search-container">
            <span>🔍</span>
            <input type="text" id="playSearch" placeholder="Search apps (Vidmate, Games...)" onkeyup="if(event.key==='Enter') searchNow()">
        </div>
    </div>

    <div id="status">Fetching latest apps...</div>
    <div id="appList" class="app-list">
        </div>

    <script>
        let uniqueApps = new Set();

        async function loadStore(query = "top free apps") {
            const list = document.getElementById('appList');
            const status = document.getElementById('status');
            
            if(query !== "top free apps") {
                list.innerHTML = "";
                uniqueApps.clear();
            }

            status.style.display = "block";
            status.innerText = "Connecting to Chrome Servers...";

            try {
                // Fetching large variety of apps
                const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=software&limit=50`);
                const data = await response.json();
                
                status.style.display = "none";

                if (data.results.length === 0) {
                    list.innerHTML = "<p style='text-align:center; padding:20px;'>No results. Searching Browser...</p>";
                    setTimeout(() => { goChrome(query); }, 1500);
                    return;
                }

                data.results.forEach(app => {
                    if (!uniqueApps.has(app.trackId)) {
                        uniqueApps.add(app.trackId);
                        list.innerHTML += `
                            <div class="app-item">
                                <img src="${app.artworkUrl100}" class="app-icon">
                                <div class="app-info">
                                    <div class="app-name">${app.trackName}</div>
                                    <div class="app-dev">${app.artistName} • Free</div>
                                </div>
                                <button class="install-btn" onclick="goChrome('${app.trackName}')">Install</button>
                            </div>
                        `;
                    }
                });
            } catch (e) {
                status.innerText = "Internet Connection Error!";
            }
        }

        function searchNow() {
            const q = document.getElementById('playSearch').value;
            if(q) loadStore(q);
        }

        function goChrome(name) {
            alert("Ranjan Security Scan: Verified Safe! ✅\nOpening Browser for installation...");
            // Asli chrome download link
            window.location.href = `https://en.uptodown.com/android/search/${name.replace(/\s+/g, '-')}`;
        }

        // Default Load
        window.onload = () => loadStore();
    </script>
</body>
</html>
