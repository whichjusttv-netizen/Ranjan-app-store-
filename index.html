<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Pro Store</title>
    <style>
        :root { --google-blue: #1a73e8; --google-green: #01875f; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; }
        
        /* Play Store Header */
        .header { padding: 10px 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 1000; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .profile-circle { width: 32px; height: 32px; background: #FF5722; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .search-bar { display: flex; align-items: center; background: #f1f3f4; border-radius: 25px; padding: 10px 15px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; margin-left: 10px; }

        /* Browser Apps Content */
        .app-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f3f4; }
        .app-icon { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; border: 1px solid #eee; }
        .app-info { flex: 1; }
        .app-name { font-weight: 500; font-size: 15px; color: #202124; }
        .app-tag { font-size: 11px; color: white; background: var(--google-green); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        
        .dl-btn { background: var(--google-blue); color: white; border: none; padding: 8px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Security Loader */
        #scanner { display: none; position: fixed; inset: 0; background: white; z-index: 5000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--google-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="top-row">
            <div style="font-size: 18px; font-weight: bold; color: #5f6368;">Ranjan Store</div>
            <div class="profile-circle">R</div>
        </div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="appQuery" placeholder="Vidmate, GBWhatsApp, Free Fire..." onkeyup="if(event.key==='Enter') browserSearch()">
        </div>
    </div>

    <div id="appContainer">
        <div class="app-item">
            <img src="https://img.utdstc.com/icon/101/6a3/1016a3c6c0b9d3b841b6c7a6e14a7e94:200" class="app-icon">
            <div class="app-info">
                <div class="app-name">Vidmate - HD Downloader</div>
                <div class="app-tag">Browser Exclusive</div>
            </div>
            <button class="dl-btn" onclick="openLoader('vidmate')">Install</button>
        </div>

        <div class="app-item">
            <img src="https://img.utdstc.com/icon/829/f26/829f268b37492c90823432.png:200" class="app-icon">
            <div class="app-info">
                <div class="app-name">GBWhatsApp (Anti-Ban)</div>
                <div class="app-tag">Chrome Service</div>
            </div>
            <button class="dl-btn" onclick="openLoader('gb-whatsapp')">Install</button>
        </div>
    </div>

    <div id="scanner">
        <div class="spinner"></div>
        <h3 id="scanText">Ranjan Browser-Shield: Scanning Chrome APK...</h3>
        <p style="color: grey; padding: 0 20px;">Fetching from secure global mirrors</p>
    </div>

    <script>
        function browserSearch() {
            let query = document.getElementById('appQuery').value;
            if(!query) return;

            document.getElementById('scanner').style.display = 'flex';
            document.getElementById('scanText').innerText = "Searching Chrome Servers for " + query + "...";

            setTimeout(() => {
                // Ye seedha browser ke apps uthayega
                window.location.href = `https://en.uptodown.com/android/search/${query}`;
            }, 2500);
        }

        function openLoader(slug) {
            document.getElementById('scanner').style.display = 'flex';
            document.getElementById('scanText').innerText = "Verifying External APK Integrity...";
            setTimeout(() => {
                window.location.href = `https://${slug}.en.uptodown.com/android/download`;
            }, 3000);
        }
    </script>
</body>
</html>
