<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan VIP Store</title>
    <style>
        :root { --p-green: #01875f; --gray: #5f6368; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; color: #202124; }
        .header { padding: 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        .search-box { background: #f1f3f4; border-radius: 24px; padding: 10px 20px; display: flex; align-items: center; }
        .search-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }
        #appList { padding: 10px; min-height: 400px; }
        .app-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f1f1; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .app-icon { width: 64px; height: 64px; border-radius: 14px; margin-right: 15px; border: 1px solid #eee; }
        .app-details { flex: 1; }
        .app-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; }
        .install-btn { background: var(--p-green); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #loader { display: none; text-align: center; padding: 20px; color: var(--p-green); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Ranjan Store <span style="color:gold; font-size:12px;">VIP</span></div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search Apps or Games..." onkeyup="if(event.key==='Enter') callHybridAPI()">
        </div>
    </div>

    <div id="loader">Fetching Real Apps...</div>
    <div id="appList"></div>

    <script>
        // AAPKI NEW POWERFUL API DETAILS
        const apiKey = "ad10381748mshd993eec0f97be91p192ca0jsn1c773ab2c092";
        const apiHost = "app-store-and-google-play-api.p.rapidapi.com";

        async function callHybridAPI() {
            const query = document.getElementById('searchInput').value;
            const list = document.getElementById('appList');
            const loader = document.getElementById('loader');

            if(!query) return;
            list.innerHTML = "";
            loader.style.display = "block";

            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost
                }
            };

            try {
                // Donon Store ki power ek saath
                const response = await fetch(`https://${apiHost}/v1/google-play/search?q=${query}&country=in`, options);
                const data = await response.json();
                loader.style.display = "none";

                // API results ko dikhana
                data.results.forEach(app => {
                    list.innerHTML += `
                        <div class="app-card">
                            <img src="${app.icon}" class="app-icon">
                            <div class="app-details">
                                <div class="app-name">${app.title}</div>
                                <div style="font-size:12px; color:gray;">${app.developer || 'Verified'}</div>
                            </div>
                            <button class="install-btn" onclick="startDownload('${app.title}')">Install</button>
                        </div>`;
                });
            } catch (error) {
                loader.innerText = "Limit check karein ya Internet!";
            }
        }

        function startDownload(name) {
            alert(name + " ka download shuru ho raha hai...");
            // Real APK direct download link
            const cleanName = name.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "-").toLowerCase();
            window.location.assign(`https://d.apkpure.com/b/APK/${cleanName}?version=latest`);
        }
    </script>
</body>
</html>
