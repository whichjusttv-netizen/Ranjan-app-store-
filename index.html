<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan V.I.P Store</title>
    <style>
        :root { --main-blue: #1a73e8; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; }
        .header { padding: 15px; border-bottom: 2px solid #f1f3f4; display: flex; align-items: center; justify-content: space-between; }
        .search-container { padding: 10px 15px; }
        .s-box { background: #f1f3f4; border-radius: 25px; padding: 10px 20px; display: flex; align-items: center; }
        .s-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }
        
        .app-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .app-img { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; background: #eee; }
        .app-info { flex: 1; }
        .install-btn { background: var(--main-blue); color: white; border: none; padding: 8px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* V.I.P Loading Bar */
        .progress-container { display: none; width: 100%; background: #eee; height: 6px; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #34a853; transition: 0.3s; }
        
        /* Secret Frame (Hidden) */
        #secret-frame { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 20px; font-weight: bold; color: #4285F4;">Ranjan Store <span style="font-size: 10px; color: gold;">V.I.P</span></div>
        <div style="width: 30px; height: 30px; background: #34a853; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center;">R</div>
    </div>

    <div class="search-container">
        <div class="s-box">
            <span>🔍</span>
            <input type="text" id="userInput" placeholder="Search V.I.P Apps..." onkeyup="if(event.key==='Enter') startSearch()">
        </div>
    </div>

    <div id="appList">
        </div>

    <iframe id="secret-frame" name="secret-frame"></iframe>

    <script>
        async function startSearch(query = "popular") {
            const list = document.getElementById('appList');
            const q = document.getElementById('userInput').value || query;
            list.innerHTML = "<p style='text-align:center; padding:30px;'>Connecting to Ranjan V.I.P Servers...</p>";

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=software&limit=15`);
                const data = await res.json();
                list.innerHTML = "";

                data.results.forEach(app => {
                    list.innerHTML += `
                        <div class="app-card">
                            <img src="${app.artworkUrl100}" class="app-img">
                            <div class="app-info">
                                <div style="font-weight: bold;">${app.trackName}</div>
                                <div style="font-size: 12px; color: #5f6368;">Official V.I.P Build</div>
                                <div class="progress-container" id="pc-${app.trackId}"><div class="progress-bar" id="pb-${app.trackId}"></div></div>
                            </div>
                            <button class="install-btn" id="btn-${app.trackId}" onclick="vipInstall('${app.bundleId}', '${app.trackId}', '${app.trackName}')">Install</button>
                        </div>
                    `;
                });
            } catch (e) { list.innerHTML = "Offline Mode"; }
        }

        function vipInstall(bundle, id, name) {
            const btn = document.getElementById('btn-' + id);
            const pCont = document.getElementById('pc-' + id);
            const pBar = document.getElementById('pb-' + id);

            btn.style.display = "none";
            pCont.style.display = "block";

            // Fake progress for professional look
            let progress = 0;
            let timer = setInterval(() => {
                if (progress >= 100) {
                    clearInterval(timer);
                    btn.style.display = "block";
                    btn.innerText = "Open";
                    btn.style.background = "#34a853";
                    
                    // SECRET TRIGGER: Download shuru hoga par Play Store nahi khulega
                    // Hum market link ko hidden iframe mein bhej rahe hain
                    document.getElementById('secret-frame').src = "market://details?id=" + bundle;
                    
                    alert("App installation started in background! ✅");
                } else {
                    progress += Math.random() * 12;
                    pBar.style.width = progress + "%";
                }
            }, 400);
        }

        window.onload = () => startSearch();
    </script>
</body>
</html>
