<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan VIP Store</title>
    <style>
        :root { --green: #01875f; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        .header { background: #fff; padding: 15px; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 100; }
        .search-box { background: #f1f3f4; border-radius: 25px; padding: 10px 20px; display: flex; align-items: center; margin-top: 10px; }
        .search-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }
        
        #appList { padding: 15px; }
        .app-card { background: #fff; border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .app-icon { width: 60px; height: 60px; border-radius: 12px; margin-right: 15px; }
        .app-info { flex: 1; }
        .app-name { font-weight: bold; font-size: 16px; margin-bottom: 3px; }
        .app-cat { font-size: 11px; color: #666; background: #eee; padding: 2px 8px; border-radius: 5px; display: inline-block; }
        
        .get-btn { background: var(--green); color: white; border: none; padding: 8px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .p-bar-bg { display: none; width: 100%; height: 5px; background: #eee; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .p-bar-fill { width: 0%; height: 100%; background: var(--green); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; font-size: 22px;">Ranjan Store <span style="color: gold; font-size: 12px;">VIP</span></div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="sInput" placeholder="Search (Games, Mods, Apps)..." onkeyup="searchEngine()">
        </div>
    </div>

    <div id="appList">
        </div>

    <iframe id="downloadFrame" style="display:none;"></iframe>

    <script>
        // MASTER DATABASE: Aapki search isi list se chalegi
        const db = [
            { id: 1, name: "Free Fire MAX", cat: "Action Game", icon: "https://img.utdstc.com/icon/97a/421/97a421689771694f27577531776957242.png:200", link: "https://d.apkpure.com/b/APK/com.dts.freefiremax?version=latest" },
            { id: 2, name: "Vidmate HD", cat: "Video Downloader", icon: "https://img.utdstc.com/icon/101/6a3/1016a3c6c0b9d3b841b6c7a6e14a7e94:200", link: "https://vidmate.en.uptodown.com/android/download" },
            { id: 3, name: "WhatsApp Pro", cat: "Messaging", icon: "https://img.utdstc.com/icon/00d/956/00d9564177d853eeb40b953d4c721c5f35d25e83921204d80d2495b2176b6b7a:200", link: "https://d.apkpure.com/b/APK/com.whatsapp?version=latest" },
            { id: 4, name: "Instagram Mod", cat: "Social Media", icon: "https://img.utdstc.com/icon/b7f/a32/b7fa32c7f66a218f297921a2eb4ccdb35a822002cd4d96c8369ec23f46f3a7d1:200", link: "https://d.apkpure.com/b/APK/com.instagram.android?version=latest" },
            { id: 5, name: "BGMI", cat: "Action Game", icon: "https://img.utdstc.com/icon/963/468/963468903e6203a3d537f90f6b47c050a41d720c766e480e77d07945930b533d:200", link: "https://battlegrounds-mobile-india.en.uptodown.com/android/download" }
        ];

        function render(data) {
            const list = document.getElementById('appList');
            list.innerHTML = "";
            data.forEach(a => {
                list.innerHTML += `
                    <div class="app-card">
                        <img src="${a.icon}" class="app-icon">
                        <div class="app-info">
                            <div class="app-name">${a.name}</div>
                            <div class="app-cat">${a.cat}</div>
                            <div class="p-bar-bg" id="box-${a.id}"><div class="p-fill" id="fill-${a.id}" style="width:0%; height:100%; background:var(--green); transition:0.3s;"></div></div>
                        </div>
                        <button class="get-btn" id="btn-${a.id}" onclick="startSilentInstall('${a.id}', '${a.link}')">GET</button>
                    </div>
                `;
            });
        }

        // Search Engine Logic
        function searchEngine() {
            let q = document.getElementById('sInput').value.toLowerCase();
            let filtered = db.filter(app => app.name.toLowerCase().includes(q) || app.cat.toLowerCase().includes(q));
            render(filtered);
        }

        function startSilentInstall(id, url) {
            const btn = document.getElementById('btn-' + id);
            const box = document.getElementById('box-' + id);
            const fill = document.getElementById('fill-' + id);

            btn.style.display = "none";
            box.style.display = "block";

            let w = 0;
            let t = setInterval(() => {
                if (w >= 100) {
                    clearInterval(t);
                    // REAL DOWNLOAD: Bina page change download shuru
                    document.getElementById('downloadFrame').src = url;
                    alert("Real Download Shuru! Check Notification bar to Install. ✅");
                    btn.style.display = "block";
                    btn.innerText = "OPEN";
                    box.style.display = "none";
                } else {
                    w += Math.random() * 15;
                    fill.style.width = w + "%";
                }
            }, 300);
        }

        window.onload = () => render(db);
    </script>
</body>
</html>
