<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Store VIP</title>
    <style>
        :root { --p-green: #01875f; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fff; }
        .header { padding: 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 100; }
        .search-box { background: #f1f3f4; border-radius: 24px; padding: 10px 20px; display: flex; align-items: center; }
        .search-box input { border: none; background: transparent; flex: 1; outline: none; font-size: 16px; margin-left: 10px; }
        #appList { padding: 10px; }
        .app-card { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f1f1; }
        .app-icon { width: 60px; height: 60px; border-radius: 12px; margin-right: 15px; }
        .install-btn { background: var(--p-green); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #loader { display: none; text-align: center; padding: 20px; color: var(--p-green); }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 20px; font-weight: 900; margin-bottom: 10px;">Ranjan Store <span style="color:gold; font-size:12px;">VIP</span></div>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search Apps..." onkeyup="if(event.key==='Enter') runRanjanSearch()">
        </div>
    </div>

    <div id="loader">Fetching Apps...</div>
    <div id="appList"></div>

    <script>
        // AAPKE SCREENSHOT 7016.JPG SE LI GAYI DETAILS
        const myKey = "ad10381748mshd993eec0f97be91p192ca0jsn1c773ab2c092";
        const myHost = "app-store-and-google-play-api.p.rapidapi.com";

        async function runRanjanSearch() {
            const query = document.getElementById('searchInput').value;
            const list = document.getElementById('appList');
            const loader = document.getElementById('loader');

            if(!query) return;
            list.innerHTML = "";
            loader.style.display = "block";

            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': myKey,
                    'x-rapidapi-host': myHost
                }
            };

            try {
                // Aapki subscribed API se search karna
                const response = await fetch(`https://${myHost}/v1/google-play/search?q=${query}&country=in`, options);
                const data = await response.json();
                loader.style.display = "none";

                // Results dikhana
                data.results.forEach(app => {
                    list.innerHTML += `
                        <div class="app-card">
                            <img src="${app.icon}" class="app-icon">
                            <div style="flex:1;">
                                <div style="font-weight:600;">${app.title}</div>
                                <div style="font-size:12px; color:gray;">${app.developer}</div>
                            </div>
                            <button class="install-btn" onclick="startDownload('${app.title}')">Install</button>
                        </div>`;
                });
            } catch (error) {
                loader.innerText = "Error! Please check subscription.";
            }
        }

        function startDownload(name) {
            alert(name + " download shuru ho raha hai...");
            const clean = name.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "-").toLowerCase();
            window.location.assign(`https://d.apkpure.com/b/APK/${clean}?version=latest`);
        }
    </script>
</body>
</html>
