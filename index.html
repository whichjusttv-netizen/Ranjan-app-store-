<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Store Login</title>
    <style>
        :root { --google-blue: #1a73e8; --google-green: #01875f; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Login Screen Style */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .google-logo { width: 75px; margin-bottom: 20px; }
        .login-title { font-size: 24px; margin-bottom: 10px; font-weight: 400; }
        .login-sub { color: #5f6368; margin-bottom: 30px; }
        .input-field { width: 100%; max-width: 350px; padding: 15px; border: 1px solid #dadce0; border-radius: 4px; margin-bottom: 15px; font-size: 16px; outline-color: var(--google-blue); }
        .login-btn { background: var(--google-blue); color: white; border: none; padding: 12px 25px; border-radius: 4px; font-weight: 500; cursor: pointer; width: 100%; max-width: 350px; font-size: 16px; }

        /* Store Interface (Hidden Initially) */
        #main-store { display: none; }
        .header { padding: 10px 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 100; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .profile-icon { width: 35px; height: 35px; background: var(--google-blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .search-container { background: #f1f3f4; border-radius: 25px; padding: 10px 15px; margin-top: 10px; display: flex; align-items: center; }
        .search-container input { border: none; background: transparent; flex: 1; outline: none; margin-left: 10px; }

        /* App Items */
        .app-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f3f4; }
        .app-icon { width: 50px; height: 50px; border-radius: 12px; margin-right: 15px; }
        .app-info { flex: 1; }
        .app-name { font-weight: 500; font-size: 15px; }
        .dl-btn { background: var(--google-blue); color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="google-logo">
        <div class="login-title">Sign in</div>
        <div class="login-sub">Use your Google Account</div>
        <input type="email" id="userEmail" class="input-field" placeholder="Email or phone">
        <input type="password" id="userPass" class="input-field" placeholder="Enter your password">
        <button class="login-btn" onclick="fakeLogin()">Next</button>
        <p style="color: #1a73e8; margin-top: 20px; cursor: pointer;">Create account</p>
    </div>

    <div id="main-store">
        <div class="header">
            <div class="top-row">
                <div style="font-size: 20px; font-weight: bold; color: #5f6368;">Ranjan Store</div>
                <div class="profile-icon" id="userInitial">U</div>
            </div>
            <div class="search-container">
                <span>🔍</span>
                <input type="text" placeholder="Search apps & games..." onkeyup="if(event.key==='Enter') search()">
            </div>
        </div>

        <div class="app-list">
            <div class="app-row">
                <img src="https://img.utdstc.com/icon/97a/421/97a421689771694f27577531776957242.png:200" class="app-icon">
                <div class="app-info"><div class="app-name">Free Fire MAX</div><div style="font-size:12px; color:grey;">Garena • 600 MB</div></div>
                <button class="dl-btn" onclick="dl('Free Fire MAX', 'https://free-fire-max.en.uptodown.com/android/download')">Install</button>
            </div>
            <div class="app-row">
                <img src="https://img.utdstc.com/icon/142/502/142502690d7945d81b4f2c00994f38858.png:200" class="app-icon">
                <div class="app-info"><div class="app-name">WhatsApp</div><div style="font-size:12px; color:grey;">Meta • 35 MB</div></div>
                <button class="dl-btn" onclick="dl('WhatsApp', 'https://whatsapp-messenger.en.uptodown.com/android/download')">Install</button>
            </div>
        </div>
    </div>

    <script>
        // Login Logic
        function fakeLogin() {
            let email = document.getElementById('userEmail').value;
            let pass = document.getElementById('userPass').value;

            if(email.includes('@') && pass.length > 4) {
                localStorage.setItem('ranjan_login', 'true');
                localStorage.setItem('ranjan_user', email[0].toUpperCase());
                showStore();
            } else {
                alert("Kripya sahi Google ID aur Password dalein!");
            }
        }

        function showStore() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-store').style.display = 'block';
            document.getElementById('userInitial').innerText = localStorage.getItem('ranjan_user') || 'U';
        }

        function dl(name, url) {
            alert(name + " ki security scan ho rahi hai... Download shuru ho raha hai.");
            window.location.href = url;
        }

        function search() {
            let q = document.querySelector('.search-container input').value;
            if(q) window.location.href = `https://en.uptodown.com/android/search/${q}`;
        }

        // Check if already logged in
        window.onload = function() {
            if(localStorage.getItem('ranjan_login')) {
                showStore();
            }
        }
    </script>
</body>
</html>
