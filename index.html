<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Store Pro</title>
    <style>
        :root { --google-blue: #1a73e8; --text-grey: #5f6368; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background: #fff; }
        
        /* Play Store Header */
        .header { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; background: white; z-index: 1000; }
        .search-container { display: flex; align-items: center; background: #f1f3f4; border-radius: 8px; padding: 10px 15px; }
        .search-container input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; margin-left: 10px; }
        
        /* App Row Layout */
        .app-row { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f1f3f4; }
        .app-icon { width: 56px; height: 56px; border-radius: 12px; margin-right: 15px; object-fit: cover; background: #eee; }
        .app-details { flex: 1; min-width: 0; }
        .app-name { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-dev { font-size: 12px; color: var(--text-grey); margin-top: 2px; }

        .install-btn { background: var(--google-blue); color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: 500; cursor: pointer; }
        #loader { text-align: center; padding: 20px; color: var(--google-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 18px; font-weight: bold; color: #5f6368; margin-bottom: 10px;">Ranjan Store</div>
        <div class="search-container">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search apps, games & browser tools..." onkeyup="if(event.key==='Enter') fetchApps(this.value)">
        </div>
    </div>

    <div id="results">
        </div>
    <div id="loader">Loading fresh apps...</div>

    <script>
        // List to keep track of unique apps (No Repeats)
        let seenApps = new Set();

        async function fetchApps(query = "popular") {
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            loader.style.display = "block";
            
            // If it's a new search, clear everything
            if(query !== "popular") {
                resultsDiv.innerHTML = "";
                seenApps.clear();
            }

            try {
                // Fetching from multiple terms to get a diverse list
                const terms = query === "popular" ? ["games", "social", "music", "tools", "video"] : [query];
                
                for (let term of terms) {
                    const response = await fetch(`https://itunes.apple.com/search?term=${term}&entity=software&limit=20`);
                    const data = await response.json();

                    data.results.forEach(app => {
                        // Check if app was already added to avoid repetition
                        if (!seenApps.has(app.trackId)) {
                            seenApps.add(app.trackId);
                            resultsDiv.innerHTML += `
                                <div class="app-row">
                                    <img src="${app.artworkUrl100}" class="app-icon">
                                    <div class="app-details">
                                        <div class="app-name">${app.trackName}</div>
                                        <div class="app-dev">${app.artistName} • Free</div>
                                    </div>
                                    <button class="install-btn" onclick="install('${app.trackName}')">Install</button>
                                </div>
                            `;
                        }
                    });
                }
                loader.style.display = "none";
            } catch (e) {
                loader.innerText = "Check internet connection!";
            }
        }

        function install(name) {
            alert("Ranjan Guard: " + name + " is safe. Connecting to Browser Mirror...");
            window.location.href = `https://en.uptodown.com/android/search/${name}`;
        }

        // Load 100% Online List on start
        window.onload = () => fetchApps("popular");
    </script>
</body>
</html>
